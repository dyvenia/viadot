name: Template Static Site Prepare (Zensical)

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner image (e.g. ubuntu-latest)"
        type: string
        required: false
        default: ubuntu-latest
      project_manager:
        description: "Python project manager: uv or rye"
        type: string
        required: false
        default: uv
      uv_sync_flags:
        description: "Optional flags for the `uv sync` command (e.g. `--group docs` or `--extra docs`). Ignored when using rye."
        type: string
        required: false
      static_site_branch:
        description: "Branch to publish built site to"
        type: string
        required: false
        default: static-site
      site_dir:
        description: "Output directory for zensical build"
        type: string
        required: false
        default: site

permissions:
  contents: write

jobs:
  deploy:
    name: Setup, Build, and Deploy
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Tool setup ---
      - name: Set up uv
        if: ${{ inputs.project_manager == 'uv' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up rye
        if: ${{ inputs.project_manager == 'rye' }}
        uses: eifinger/setup-rye@c694239a43768373e87d0103d7f547027a23f3c8 # v4.2.9

      # --- Sync dependencies ---
      - name: Sync dependencies uv
        if: ${{ inputs.project_manager == 'uv' }}
        run: uv sync ${{ inputs.uv_sync_flags || '' }}

      - name: Sync dependencies rye
        if: ${{ inputs.project_manager == 'rye' }}
        run: rye sync

      # --- Build Site ---
      - name: Build site uv
        if: ${{ inputs.project_manager == 'uv' }}
        run: uv run zensical build --clean

      - name: Build site rye
        if: ${{ inputs.project_manager == 'rye' }}
        run: rye run zensical build --clean

      # --- Deploy Site ---
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: ${{ inputs.static_site_branch }}
          folder: ${{ inputs.site_dir }}
          clean: true
