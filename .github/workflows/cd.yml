name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release version."
        required: true
        default: "v2.x.x"

jobs:
  build-distribution:
    name: Build distribution 📦
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install pypa/build
        run: python3 -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI 🚀
    timeout-minutes: 5
    needs:
      - build-distribution
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/viadot2
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true

  publish-docker-images:
    name: Publish Docker images 🐳
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construct the tag for Docker images
        run: |
          # Strip the "v" prefix for the image tag.
          VERSION=${{ github.event.inputs.version }}
          echo "TAG=${VERSION#v}" >> $GITHUB_ENV

      - name: Build and publish viadot-lite image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          target: viadot-lite
          tags: |
            ghcr.io/${{ github.repository }}/viadot-lite:${{ env.TAG }}
            ghcr.io/${{ github.repository }}/viadot-lite:latest

      - name: Build and publish viadot-aws image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          target: viadot-aws
          tags: |
            ghcr.io/${{ github.repository }}/viadot-aws:${{ env.TAG }}
            ghcr.io/${{ github.repository }}/viadot-aws:latest

      - name: Build and publish viadot-azure image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          target: viadot-azure
          tags: |
            ghcr.io/${{ github.repository }}/viadot-azure:${{ env.TAG }}
            ghcr.io/${{ github.repository }}/viadot-azure:latest
          build-args: INSTALL_DATABRICKS=false

  create_github_release:
    name: Create a GitHub release 🔖
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          generateReleaseNotes: true
          tag: ${{ github.event.inputs.version }}
